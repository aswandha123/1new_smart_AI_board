<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Smart Board</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top Bar -->
      <header class="top-bar" id="top-bar">
        <div class="top-bar-left">
          <div class="brand">
            <div class="brand-icon">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </div>
            <h1 class="brand-title">AI Smart Board</h1>
          </div>

          <div class="board-title-container">
            <input type="text" id="input-board-name" class="board-name-input" value="Untitled Board" title="Click to rename board" placeholder="Board Name" />
          </div>
        </div>

        <div class="top-bar-right">
          <button class="btn-top-bar" id="btn-new-board" title="Create a New Board" aria-label="New Board">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>New</span>
          </button>

          <button class="btn-top-bar" id="btn-boards-list" title="Open Saved Boards" aria-label="Open Saved Boards">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span>Boards</span>
          </button>

          <!-- Hidden PDF File Input and Upload Button -->
          <input type="file" id="input-pdf-upload" accept="application/pdf" style="display: none;" />
          <button class="btn-top-bar" id="btn-upload-pdf" title="Upload and Display PDF" aria-label="Upload PDF">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="12" y1="18" x2="12" y2="12"></line>
              <polyline points="9 15 12 12 15 15"></polyline>
            </svg>
            <span>Upload PDF</span>
          </button>

          <button class="btn-top-bar btn-primary-action" id="btn-save" title="Save Board (IndexedDB)" aria-label="Save Board">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Save</span>
          </button>

          <!-- Export Dropdown -->
          <div class="export-dropdown-wrapper" id="export-dropdown-wrapper">
            <button class="btn-top-bar" id="btn-export" title="Export / Print Board" aria-label="Export Board">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              <span>Export</span>
            </button>

            <div class="export-popover hidden" id="export-popover">
                <div class="export-section-label">PDF Document</div>
              <button class="export-option-btn export-highlight-btn" id="btn-export-annotated-pdf" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Export Annotated PDF</span>
              </button>

              <div class="export-section-label">Entire Class Note</div>
              <button class="export-option-btn export-highlight-btn" id="btn-export-classnote-pdf">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                  <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>Export Note as PDF</span>
              </button>

              <div class="export-popover-separator"></div>

              <div class="export-section-label">Current Page Only</div>
              <button class="export-option-btn" id="btn-export-png">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <circle cx="8.5" cy="8.5" r="1.5"></circle>
                  <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>Export Page (PNG)</span>
              </button>
              <button class="export-option-btn" id="btn-export-svg">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="16 18 22 12 16 6"></polyline>
                  <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                <span>Export Page (SVG)</span>
              </button>
              <button class="export-option-btn" id="btn-export-print">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="6 9 6 2 18 2 18 9"></polyline>
                  <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                  <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                <span>Print Current Page</span>
              </button>
            </div>
          </div>

          <button class="btn-top-bar" id="btn-settings" title="Settings" aria-label="Settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Settings</span>
          </button>
        </div>
      </header>

      <!-- Main Board Area -->
      <main class="board-area" id="board-area">
        <div id="whiteboard-container"></div>

        <!-- PDF Viewer Floating Controls Panel -->
        <div class="pdf-dock-panel hidden" id="pdf-dock-panel">
          <div class="pdf-dock-info">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span class="pdf-doc-title" id="pdf-doc-title">Document.pdf</span>
          </div>

          <div class="pdf-dock-divider"></div>

          <div class="pdf-page-nav-group">
            <button class="btn-pdf-nav" id="btn-pdf-prev" title="Previous PDF Page" aria-label="Previous PDF Page" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <span class="pdf-page-indicator" id="pdf-page-indicator">PDF Page 1 of 1</span>
            <button class="btn-pdf-nav" id="btn-pdf-next" title="Next PDF Page" aria-label="Next PDF Page" disabled>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>

          <div class="pdf-dock-divider"></div>

          <button class="btn-pdf-action" id="btn-pdf-fit" title="Fit PDF Page to Viewport" aria-label="Fit Page">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h6v6"></path>
              <path d="M9 21H3v-6"></path>
              <path d="M21 3l-7 7"></path>
              <path d="M3 21l7-7"></path>
            </svg>
            <span>Fit Page</span>
          </button>

          <button class="btn-pdf-close" id="btn-pdf-close" title="Close PDF Document" aria-label="Close PDF">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
            <span>Close</span>
          </button>
        </div>

        <!-- Multi-Page Navigation Bar Dock -->
        <aside class="pages-dock-panel" id="pages-dock-panel">
          <!-- Toggle Drawer Button & Current Page Indicator -->
          <button class="btn-pages-toggle" id="btn-toggle-pages-drawer" title="Toggle Pages Drawer" aria-label="Toggle Pages Drawer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            <span id="label-pages-toggle">Pages (1/1)</span>
          </button>

          <div class="pages-nav-controls">
            <!-- Previous Page -->
            <button class="btn-page-nav" id="btn-prev-page" title="Previous Page" aria-label="Previous Page" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>

            <!-- Page Number Label and Editable Name -->
            <div class="page-info-display">
              <span class="page-number-text" id="label-page-number">Page 1 of 1</span>
              <input type="text" class="page-name-input" id="input-page-name" value="Page 1" title="Click to rename page" />
            </div>

            <!-- Next Page -->
            <button class="btn-page-nav" id="btn-next-page" title="Next Page" aria-label="Next Page" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>
          </div>

          <div class="pages-actions-group">
            <!-- Add Page -->
            <button class="btn-page-action btn-add-page" id="btn-add-page" title="Add New Page" aria-label="Add Page">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Page</span>
            </button>

            <!-- Duplicate Page -->
            <button class="btn-page-action" id="btn-duplicate-page" title="Duplicate Current Page" aria-label="Duplicate Page">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Duplicate</span>
            </button>

            <!-- AI (moved from bottom toolbar) -->
            <button class="btn-page-action ai-btn" id="tool-ai" data-tool="ai" title="AI Assistant" aria-label="AI Tool">
              <div class="ai-icon-container">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3l1.912 5.885L20 10.8l-4.706 4.115L16.471 21 12 17.5 7.529 21l1.177-6.085L4 10.8l6.088-1.915L12 3z"></path>
                </svg>
              </div>
              <span>AI</span>
            </button>

            <!-- Delete Page -->
            <button class="btn-page-action btn-delete-page" id="btn-delete-page" title="Delete Current Page" aria-label="Delete Page" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>Delete</span>
            </button>
          </div>
        </aside>

        <!-- Expandable Thumbnail Drawer -->
        <div class="pages-thumbnail-drawer hidden" id="pages-thumbnail-drawer">
          <div class="drawer-header">
            <div class="drawer-title-group">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
              </svg>
              <h3>Class Note Pages</h3>
            </div>
            <button class="btn-drawer-close" id="btn-close-pages-drawer" aria-label="Close">&times;</button>
          </div>
          <div class="thumbnail-list-container" id="pages-thumbnail-list">
            <!-- Dynamic thumbnails rendered here -->
          </div>
        </div>
      </main>

      <!-- Bottom Toolbar -->
      <footer class="bottom-toolbar-wrapper">
        <nav class="bottom-toolbar" id="bottom-toolbar" aria-label="Smart Board Tools">
          <!-- Pen -->
          <button class="tool-btn active" id="tool-pen" data-tool="pen" title="Pen" aria-label="Pen Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19l7-7 3 3-7 7-3-3z"></path>
              <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
              <path d="M2 2l7.586 7.586"></path>
              <circle cx="11" cy="11" r="2"></circle>
            </svg>
            <span class="tool-label">Pen</span>
          </button>

          <!-- Pencil -->
          <button class="tool-btn" id="tool-pencil" data-tool="pencil" title="Pencil" aria-label="Pencil Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="2" x2="22" y2="6"></line>
              <path d="M7.5 20.5 19 9l-4-4L3.5 16.5 2 22z"></path>
            </svg>
            <span class="tool-label">Pencil</span>
          </button>

          <!-- Highlighter -->
          <button class="tool-btn" id="tool-highlighter" data-tool="highlighter" title="Highlighter" aria-label="Highlighter Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 11-6 6v3h3l6-6"></path>
              <path d="m22 2-4.5 4.5"></path>
              <path d="M13.5 6.5 17.5 10.5"></path>
              <path d="m14 14 3-3 4 4-3 3z"></path>
            </svg>
            <span class="tool-label">Highlighter</span>
          </button>

          <!-- Eraser -->
          <button class="tool-btn" id="tool-eraser" data-tool="eraser" title="Eraser" aria-label="Eraser Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
              <path d="M22 21H7"></path>
              <path d="m5 11 9 9"></path>
            </svg>
            <span class="tool-label">Eraser</span>
          </button>

          <div class="toolbar-separator" role="separator"></div>

          <!-- Color Picker Control -->
          <div class="toolbar-control color-control-wrapper" title="Stroke Color">
            <input type="color" id="input-color" class="color-picker-input" value="#000000" aria-label="Stroke Color" />
            <span class="tool-label">Color</span>
          </div>

          <!-- Stroke Width Slider Control -->
          <div class="toolbar-control width-control-wrapper" title="Stroke Width">
            <div class="width-slider-row">
              <input type="range" id="input-width" class="width-range-slider" min="1" max="40" value="3" aria-label="Stroke Width" />
              <span class="width-value-label" id="width-value-label">3 px</span>
            </div>
            <span class="tool-label">Width</span>
          </div>

          <div class="toolbar-separator" role="separator"></div>

          <!-- Undo -->
          <button class="tool-btn action-btn-history" id="btn-undo" title="Undo" aria-label="Undo" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7v6h6"></path>
              <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
            </svg>
            <span class="tool-label">Undo</span>
          </button>

          <!-- Redo -->
          <button class="tool-btn action-btn-history" id="btn-redo" title="Redo" aria-label="Redo" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 7v6h-6"></path>
              <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"></path>
            </svg>
            <span class="tool-label">Redo</span>
          </button>

          <!-- Clear -->
          <button class="tool-btn action-btn-history" id="btn-clear" title="Clear Board" aria-label="Clear Board">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"></path>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            <span class="tool-label">Clear</span>
          </button>

          <div class="toolbar-separator" role="separator"></div>

          <!-- Zoom & Pan Controls -->
          <div class="toolbar-control zoom-control-wrapper" title="Zoom & Pan View">
            <div class="zoom-controls-row">
              <button class="zoom-btn" id="btn-zoom-out" title="Zoom Out" aria-label="Zoom Out">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <span class="zoom-percentage-label" id="zoom-percentage-label">100%</span>
              <button class="zoom-btn" id="btn-zoom-in" title="Zoom In" aria-label="Zoom In">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <button class="zoom-btn reset-view-btn" id="btn-reset-view" title="Reset View (100%)" aria-label="Reset View">
                Reset
              </button>
            </div>
            <span class="tool-label">Zoom (Space+Drag to Pan)</span>
          </div>

          <div class="toolbar-separator" role="separator"></div>

          <!-- Shapes Wrapper with Popover Menu -->
          <div class="shapes-tool-wrapper" id="shapes-wrapper">
            <button class="tool-btn" id="tool-shapes" data-tool="shapes" title="Shapes (Click to choose shape)" aria-label="Shapes Tool">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="shapes-btn-icon">
                <rect x="3" y="3" width="8" height="8" rx="1"></rect>
                <circle cx="17" cy="7" r="4"></circle>
                <polygon points="12 21 16 14 8 14"></polygon>
              </svg>
              <span class="tool-label" id="shapes-btn-label">Shapes</span>
            </button>

            <!-- Shapes Popover Submenu -->
            <div class="shapes-popover hidden" id="shapes-popover">
              <button class="shape-option-btn active" data-shape="rectangle" title="Rectangle" aria-label="Rectangle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                </svg>
                <span>Rectangle</span>
              </button>
              <button class="shape-option-btn" data-shape="ellipse" title="Ellipse / Circle" aria-label="Ellipse">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9"></circle>
                </svg>
                <span>Ellipse</span>
              </button>
              <button class="shape-option-btn" data-shape="triangle" title="Triangle" aria-label="Triangle">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="12 3 22 21 2 21"></polygon>
                </svg>
                <span>Triangle</span>
              </button>
            </div>
          </div>

          <!-- Line -->
          <button class="tool-btn" id="tool-line" data-tool="line" title="Line" aria-label="Line Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="20" x2="20" y2="4"></line>
              <circle cx="4" cy="20" r="1.5" fill="currentColor"></circle>
              <circle cx="20" cy="4" r="1.5" fill="currentColor"></circle>
            </svg>
            <span class="tool-label">Line</span>
          </button>

          <!-- Arrow -->
          <button class="tool-btn" id="tool-arrow" data-tool="arrow" title="Arrow" aria-label="Arrow Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="19" x2="19" y2="5"></line>
              <polyline points="10 5 19 5 19 14"></polyline>
            </svg>
            <span class="tool-label">Arrow</span>
          </button>

          <!-- Text Tool Wrapper with Options Popover -->
          <div class="text-tool-wrapper" id="text-wrapper">
            <button class="tool-btn" id="tool-text" data-tool="text" title="Text (Click board to add text)" aria-label="Text Tool">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="4 7 4 4 20 4 20 7"></polyline>
                <line x1="9" y1="20" x2="15" y2="20"></line>
                <line x1="12" y1="4" x2="12" y2="20"></line>
              </svg>
              <span class="tool-label">Text</span>
            </button>

            <!-- Text Options Popover -->
            <div class="text-options-popover hidden" id="text-options-popover">
              <div class="text-option-group">
                <label for="select-font-family" class="text-option-label">Font</label>
                <select id="select-font-family" class="text-select">
                  <option value="Arial" selected>Arial</option>
                  <option value="Georgia">Georgia</option>
                  <option value="Verdana">Verdana</option>
                  <option value="Times New Roman">Times New Roman</option>
                </select>
              </div>

              <div class="text-option-group">
                <div class="text-option-label-row">
                  <label for="input-font-size" class="text-option-label">Size</label>
                  <span id="font-size-label" class="text-option-val">24 px</span>
                </div>
                <input type="range" id="input-font-size" class="text-range-slider" min="12" max="96" value="24" />
              </div>

              <div class="text-option-group">
                <span class="text-option-label">Align</span>
                <div class="text-align-btn-group">
                  <button type="button" class="text-align-btn active" id="btn-align-left" data-align="left" title="Align Left">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg>
                  </button>
                  <button type="button" class="text-align-btn" id="btn-align-center" data-align="center" title="Align Center">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="10" x2="6" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="18" y1="18" x2="6" y2="18"></line></svg>
                  </button>
                  <button type="button" class="text-align-btn" id="btn-align-right" data-align="right" title="Align Right">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="10" x2="7" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="21" y1="18" x2="7" y2="18"></line></svg>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Equation / Math Tool -->
          <button class="tool-btn" id="tool-equation" data-tool="equation" title="Equation Tool (Math)" aria-label="Equation Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="4"></line>
              <line x1="6" y1="20" x2="6" y2="4"></line>
              <line x1="6" y1="4" x2="18" y2="20"></line>
            </svg>
            <span class="tool-label">Math</span>
          </button>

          <!-- Select -->
          <button class="tool-btn" id="tool-select" data-tool="select" title="Select" aria-label="Select Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path>
              <path d="m13 13 6 6"></path>
            </svg>
            <span class="tool-label">Select</span>
          </button>

          <!-- Lasso -->
          <button class="tool-btn" id="tool-lasso" data-tool="lasso" title="Lasso Select" aria-label="Lasso Tool">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 22a5 5 0 0 1-2-4c0-4 4.5-6.5 8.5-7.5C18 9.5 21 8 21 5.5 21 3 18.5 2 15 2c-5 0-9 4-9 9 0 3 1.5 5.5 3 7"></path>
              <path d="M3.5 14.5c.5 2.5 2 4.5 4.5 5.5"></path>
            </svg>
            <span class="tool-label">Lasso</span>
          </button>

          <!-- Copy -->
          <button class="tool-btn action-btn-edit" id="btn-copy" title="Copy Selected Object (Ctrl+C)" aria-label="Copy" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="tool-label">Copy</span>
          </button>

          <!-- Paste -->
          <button class="tool-btn action-btn-edit" id="btn-paste" title="Paste Object (Ctrl+V)" aria-label="Paste" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <span class="tool-label">Paste</span>
          </button>

          <!-- Delete -->
          <button class="tool-btn action-btn-edit" id="btn-delete" title="Delete Selected Object (Del / Backspace)" aria-label="Delete" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
            <span class="tool-label">Delete</span>
          </button>

          <div class="toolbar-separator" role="separator"></div>

        </nav>
      </footer>

      <!-- AI Handwriting Recognition Modal -->
      <div class="ai-modal-overlay hidden" id="ai-recognition-modal-overlay">
        <div class="ai-modal">
          <div class="ai-modal-header">
            <div class="modal-header-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.912 5.885L20 10.8l-4.706 4.115L16.471 21 12 17.5 7.529 21l1.177-6.085L4 10.8l6.088-1.915L12 3z"></path>
              </svg>
              <h2>Handwriting Recognition</h2>
            </div>
            <button class="modal-close-btn" id="btn-close-ai-modal" aria-label="Close AI Modal">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="ai-modal-body">
            <div class="ai-modal-row">
              <label for="recognition-mode-select" class="ai-modal-label">Recognition mode</label>
              <select id="recognition-mode-select" class="ai-modal-select" aria-label="Recognition mode selector">
                <option value="math">Math</option>
                <option value="text">Text</option>

              </select>
            </div>
            <p class="ai-modal-description" id="ai-modal-description">
              Select a recognition mode and click Recognize.
            </p>
            <div class="ai-modal-summary" id="ai-modal-summary"></div>
            <div class="ai-modal-output" id="ai-modal-output"></div>
            <textarea id="ai-modal-textarea" class="ai-modal-textarea hidden" aria-label="Recognized handwriting text preview"></textarea>
          </div>
          <div class="ai-modal-actions">
            <button class="btn-top-bar btn-secondary" id="btn-ai-cancel" type="button">Cancel</button>
            <button class="btn-top-bar btn-primary-action" id="btn-ai-convert" type="button">Recognize</button>
          </div>
        </div>
      </div>

      <!-- Saved Boards Modal Dialog -->
      <div class="boards-modal-overlay hidden" id="boards-modal-overlay">
        <div class="boards-modal">
          <div class="boards-modal-header">
            <div class="modal-header-title">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              <h2>Saved Boards</h2>
            </div>
            <button class="modal-close-btn" id="btn-close-boards-modal" aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="boards-modal-body" id="boards-list-container">
            <!-- Dynamically populated boards list -->
          </div>
        </div>
      </div>

      <!-- Temporary Status Notification Toast -->
      <div class="status-toast hidden" id="status-toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
